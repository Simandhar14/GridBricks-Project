name: GridBricks CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          cd backend
          python -m ruff check app tests scripts

      - name: Check Formatting with Black
        run: |
          cd backend
          python -m black --check app tests scripts

      - name: Run Pytest Suite (Domain Logic, Invariants & API)
        run: |
          python -m pytest backend/tests/test_analytics.py backend/tests/test_api.py backend/tests/test_fetch_data.py -v

  frontend-quality:
    name: Frontend Type-Check, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm install

      - name: Type-Check & Build Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm test

  docker-build:
    name: Docker Container Build
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gridbricks-app:ci

